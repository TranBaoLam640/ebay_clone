# TEMPLATE ONLY — do NOT put real values here or commit the filled version.
# Create the real Secret out-of-band (see README "App Secret"), which writes
# backend-secret.yaml (gitignored). Every value below is required in production.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: sbay
type: Opaque
stringData:
  MONGODB_USERNAME: "admin"
  MONGODB_PASSWORD: "REPLACE"
  # 32+ random chars each.
  JWT_ACCESS_SECRET: "REPLACE-32+"
  JWT_REFRESH_SECRET: "REPLACE-32+"
  CSRF_SECRET: "REPLACE-32+"
  # SMTP credentials.
  EMAIL_USER: "REPLACE"
  EMAIL_PASSWORD: "REPLACE"
  # 32+ chars; env.js rejects the example placeholder in production.
  EMAIL_OTP_HMAC_SECRET: "REPLACE-32+"
