# Outbound-only Cloudflare Tunnel — no inbound ports on the VPS.
# Remotely-managed tunnel: the public hostname → service route is set in the
# Cloudflare Zero Trust dashboard (Tunnels → Public hostname →
# http://ingress-nginx-controller.ingress-nginx.svc:80).
# Token secret: kubectl -n sbay create secret generic cloudflared-token --from-literal=token=<TUNNEL_TOKEN>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: sbay
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
