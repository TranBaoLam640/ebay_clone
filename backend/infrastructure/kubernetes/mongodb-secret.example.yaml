# TEMPLATE ONLY — do not commit real values.
# Two secrets are needed (created out-of-band, see README "Mongo secrets"):
#   1) mongodb-secret  : root credentials (below)
#   2) mongodb-keyfile : the replica-set keyfile, created with
#        openssl rand -base64 756 > keyfile
#        kubectl -n sbay create secret generic mongodb-keyfile --from-file=keyfile
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: sbay
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE"
