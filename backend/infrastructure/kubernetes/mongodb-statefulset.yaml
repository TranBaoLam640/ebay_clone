apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: sbay
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      priorityClassName: mongodb-critical
      terminationGracePeriodSeconds: 30
      initContainers:
        # mongod refuses a keyfile unless it is mode 0400 owned by the mongodb user (999).
        # A Secret mount is root-owned, so copy it to an emptyDir with correct perms.
        - name: keyfile-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - "cp /secret/keyfile /etc/mongo/keyfile && chmod 400 /etc/mongo/keyfile && chown 999:999 /etc/mongo/keyfile"
          volumeMounts:
            - name: keyfile-secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /etc/mongo
      containers:
        - name: mongodb
          # Pin to the major version matching the source Mongo (verify with `mongod --version`).
          image: mongo:8
          args:
            - "--replSet"
            - "rs0"
            - "--keyFile"
            - "/etc/mongo/keyfile"
            - "--bind_ip_all"
          ports:
            - containerPort: 27017
              name: mongo
          envFrom:
            - secretRef:
                name: mongodb-secret     # MONGO_INITDB_ROOT_USERNAME / _PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # Ready only once this node is PRIMARY (myState==1) — so the backend never
          # connects before the replica set can serve it.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(rs.status().myState===1?0:1)"'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mongosh --quiet --eval "db.adminCommand({ ping: 1 })"'
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongo
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongodb-keyfile
            defaultMode: 0400
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path      # k3s default provisioner
        resources:
          requests:
            storage: 5Gi
