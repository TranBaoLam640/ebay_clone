name: ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # eslint only (catches real bugs); Prettier formatting is a local convenience,
      # not a deploy blocker — run `npm run format` locally to tidy style.
      - run: npx eslint .
      - run: npm test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/konfusee/sbay-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            # Sortable, unique-per-build tag. Keel watches glob:build-* and reliably
            # detects each new tag by NAME (avoids the flaky :latest digest-diff path).
            type=raw,value=build-{{date 'YYYYMMDDHHmmss'}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
