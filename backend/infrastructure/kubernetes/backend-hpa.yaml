# Requires metrics-server (bundled by k3s). Verify: kubectl top nodes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: sbay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 3          # fit the single node; raise only after checking free RAM
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # React fast to load so the demo scales up within one JMeter run.
      stabilizationWindowSeconds: 0
    scaleDown:
      # Drop back to minReplicas ~30s after load stops (default is 300s).
      stabilizationWindowSeconds: 30
